[project]
name = "tk-ai-engine"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "firebase-admin>=7.5.0",
    "google-cloud-storage>=3.13.1",
    "jinja2>=3.1.6",
    "mlx-embeddings>=0.1.0",
    "mlx-vlm>=0.6.17",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "requests>=2.34.2",
    "scenedetect>=0.7.1",
]

[project.scripts]
tk-ai-engine = "tk_ai_engine:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
