<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TK Archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>TK Archive</h1>
      <p>Google Drive dosyalarınızı tarayın, etiketleyin ve arayın.</p>
    </header>

    <section class="controls">
      <button id="connectBtn">Google Hesabını Bağla</button>
      <button id="scanBtn" disabled>Drive'ı Tara</button>
      <button id="statusBtn">Durum</button>
      <div class="status" id="statusText">Bağlantı bekleniyor...</div>
    </section>

    <section class="search-panel">
      <input id="searchInput" type="search" placeholder="Arama yapın: business class, video, sunum..." />
      <button id="searchBtn">Ara</button>
    </section>

    <section id="results" class="results"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
